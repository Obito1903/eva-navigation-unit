[package]
name = "eva-navigation-unit"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
android-auto = { git = "https://github.com/Obito1903/android-auto", branch = "a310-fixes", features = [
    "usb",
    "wireless",
] }
async-trait = "0.1"
# Headless renderer sharing Slint's wgpu device (see src/bevy_gfx). No window,
# no winit, no input: bevy only draws into offscreen textures that Slint shows.
# Must stay on the same wgpu major as slint's `unstable-wgpu-29` (wgpu 29).
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "bevy_state",
    "bevy_window",
    "tonemapping_luts",
    # `tonemapping_luts` ships its LUTs as zstd-compressed KTX2 and leaves the
    # backend choice to the app.
    "zstd_rust",
] }
bluetooth-rust = "0.3"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.17"
libpulse-binding = "2"
libpulse-simple-binding = "2"
log = "0.4"
rustfft = "6"
nmrs = "2.0"
openh264 = "0.9"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
# Pinned exactly: `unstable-wgpu-29` is an unstable API that can change between
# minor releases, and src/bevy_gfx depends on it for the shared wgpu device.
# `unstable-wgpu-29` only exposes the API — `renderer-femtovg-wgpu` is what
# actually gives Slint a renderer that draws through wgpu.
slint = { version = "=1.17.1", features = [
    "renderer-femtovg-wgpu",
    "unstable-wgpu-29",
] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
    "tracing-log",
] }
# Optional local-visualization backends (off by default).
tracing-chrome = { version = "0.7", optional = true }
console-subscriber = { version = "0.4", optional = true }
zbus = { version = "5", optional = true }
zvariant = { version = "5", optional = true }

[build-dependencies]
slint-build = "=1.17.1"

# Optimize dependencies even in debug builds. The H.264 → RGB pixel conversion
# (openh264) is ~80× slower when compiled unoptimized, which made dev builds
# stutter badly. This keeps fast incremental recompiles of our own crate while
# building dependencies with optimizations so video decodes in real time.
[profile.dev.package."*"]
opt-level = 3

[features]
# Both transport modes enabled by default — match the android-auto path dep
default = ["jamesdsp", "networkmanager-hotspot"]

# Emit a Chrome/Perfetto trace file (open in https://ui.perfetto.dev). See
# docs for usage; adds the `tracing-chrome` layer.
chrome-trace = ["dep:tracing-chrome"]

# Link bevy dynamically. Cuts link time massively for local iteration, but the
# resulting binary needs libbevy_dylib next to it — never enable for deploys.
bevy-dynamic = ["bevy/dynamic_linking"]

# Expose a live async task view via `tokio-console`. Requires building with
# RUSTFLAGS="--cfg tokio_unstable". Adds the `console-subscriber` layer.
tokio-console = ["dep:console-subscriber"]

# JamesDSP D-Bus client (src/jamesdsp.rs): global bypass, Graphic EQ,
# Convolver, Equalizer and Bass Boost control from the Settings UI. Pulls in
# `zbus`/`zvariant`. Disabling it compiles the DSP/EQ settings tab out
# entirely (it stays in its existing "disconnected" fallback UI state).
jamesdsp = ["dep:zbus", "dep:zvariant"]

# NetworkManager D-Bus hotspot backend (src/nmrs_extensions.rs), the default
# Wi-Fi hotspot backend (`hotspot_backend = 0`). Pulls in `zbus`/`zvariant`.
# Disabling it makes selecting that backend fail gracefully at runtime
# (falls back to USB-only, same as any other hotspot-setup failure); the
# `hostapd` backend (`hotspot_backend = 1`) is unaffected — it uses no D-Bus.
networkmanager-hotspot = ["dep:zbus", "dep:zvariant"]

# Required for the v1 certificate used by android-auto (src/cert.rs).
# `[patch]` only applies from the crate being built, so it must be duplicated
# here even though android-auto declares the same patch.
[patch.crates-io]
rustls-webpki = { git = "https://github.com/uglyoldbob/webpki", branch = "main5" }
